apis:
- name: Level Website Content GraphQL API
  description: >-
    Publicly reachable GraphQL endpoint served by the Craft CMS instance behind level.co. Introspection is
    enabled anonymously, but the published public schema scope is deliberately narrow — a `ping` query and
    mutation plus `globalSet`/`globalSets` access limited to the bundleDiscounts global set. This is the
    website's content API, not a device or account API, and Level does not document it as a developer product.
  humanURL: https://level.co/
  baseURL: https://level.co/api/
  tags:
  - GraphQL
  - Content
  - CMS
  tags_raw:
  - graphql
  - content
  - cms
  properties:
  - type: GraphQLEndpoint
    url: https://level.co/api/
- name: Level Mobile Application Backend
  description: >-
    The undocumented HTTPS backend the Level Home iOS and Android applications talk to. It is an AWS API Gateway
    fronted service that returns a `{"message": "..."}` JSON error envelope and an `x-request-id` correlation
    header on every response. A small set of paths is publicly advertised through the Apple App Site Association
    and Android asset links files it serves from /.well-known — /invite/{uuid}, /pass/{id}, /verify/{token},
    /recover/{token} and /franklin/in-home/opt-in/{id} — used for universal-link invitations, guest passes and
    account recovery. There is no public specification, no developer signup and no documented authentication.
  humanURL: https://level.co/support/
  baseURL: https://api.level.co/
  tags:
  - Mobile Backend
  - Access Control
  - Undocumented
  tags_raw:
  - mobile-backend
  - access-control
  - undocumented
  properties:
  - type: AppleAppSiteAssociation
    url: well-known/level-home-apple-app-site-association.json
  - type: AssetLinks
    url: well-known/level-home-assetlinks.json
