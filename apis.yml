aid: level-home
name: Level Home
description: >-
  Level Home is the Redwood City, California maker of the "invisible" Level smart lock family — Level Lock,
  Level Lock Pro, Level Bolt and Level Keypad — which hide the motor, radios and battery inside a standard-looking
  deadbolt. The locks speak Bluetooth LE, Thread and Matter, and work with Apple Home (including Apple Home Key),
  Google Home, Amazon Alexa and SmartThings rather than through a published third-party developer API. In September
  2024 ASSA ABLOY acquired the Level Lock hardware business, brand and IP, which continues to operate as Level at
  level.co; the remaining Level Home, Inc. entity — the Level M multifamily software business, which also absorbed
  Dwelo — renamed itself Ambient Property Technologies and now sells smart access, apartment automation and building
  intelligence to multifamily owners with integrations into RealPage, Yardi, Entrata, ResMan and ButterflyMX. Level
  publishes no developer portal, no OpenAPI and no partner API documentation; the only publicly reachable
  machine-readable contracts are the Craft CMS GraphQL content endpoint behind level.co/api and the mobile
  application backend at api.level.co, which is undocumented and account-gated. Third-party developer access to
  Level devices is brokered by Seam, and local control is available through Matter/Thread.
