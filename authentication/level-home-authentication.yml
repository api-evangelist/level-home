  observed: >-
    Anonymous POST returns data for the public schema (ping, globalSets, globalSet). Craft CMS private
    schemas are selected with an Authorization: Bearer <graphql-token> header, but Level publishes no
    token and no token-issuing surface.
- host: https://api.level.co
  name: unknown
  type: unknown
  observed: >-
    No WWW-Authenticate challenge on 401/404 paths; unrouted paths return 404 rather than 401, so the
    authentication scheme is not externally observable. /.well-known/openid-configuration,
