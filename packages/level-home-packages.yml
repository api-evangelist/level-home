  name: Level Home Enterprise
  public_repos: 11
  first_party_libraries: 0
  note: >-
    Every public repository in the org is a fork of an upstream embedded/firmware or observability project
    rather than a Level library — micro-ecc, IOS-Pods-DFU-Library, sdk-nrf, sdk-zephyr, IOS-CoreBluetooth-Mock,
    aws-otel-collector, ot-efr32, gecko_sdk, simplicity_sdk, google-home-api-sample-app-android and
    home-assistant-core. The fork set is itself a useful signal: Nordic nRF + Zephyr + Silicon Labs EFR32 +
    OpenThread is a Thread/Matter lock firmware stack, and the CoreBluetooth mock points at the BLE app path.
